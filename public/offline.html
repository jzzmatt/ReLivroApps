<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReLivroApps</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf1;color:#102d52;font-family:Georgia,serif}
      main{width:min(520px,calc(100% - 40px));text-align:center}
      h1{font-size:40px;line-height:1;letter-spacing:-.04em;margin:0 0 12px}
      p{margin:0 0 10px;color:#536170;font-family:system-ui,sans-serif;line-height:1.5}
      button{margin-top:18px;border:0;border-radius:999px;background:#102d52;color:#fff;padding:12px 18px;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <h1>ReLivroApps</h1>
      <p>Sem ligação. Os livros voltam quando a rede regressar.</p>
      <p>Pas de connexion. Les livres reviennent avec le réseau.</p>
      <p>You are offline. Books will load again when the network returns.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
